name: Dagster Daily Materialization

on:
  schedule:
    # Run daily at 06:00 UTC (14:00 PHT)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run full materialization
        run: |
          python scripts/materialize_all.py

      - name: Commit updated JSON files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add web/public/data/*.json
          git diff --staged --quiet || git commit -m "chore: daily data refresh"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
